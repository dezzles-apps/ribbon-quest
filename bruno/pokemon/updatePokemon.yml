info:
  name: updatePokemon
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:5173/api/pokemon/v1/Vulpix
  headers:
    - name: Authorization
      value: Bearer {{ token }}
  body:
    type: json
    data: |-
      {
        "shiny": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
